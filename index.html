<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alya Visual Novel - Gallery</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            color: #f1f5f9;
            overflow: hidden;
        }
        .font-anime {
            font-family: 'Mochiy Pop One', sans-serif;
        }
        .glass-panel {
            background: rgba(15, 15, 25, 0.88);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 102, 196, 0.35);
            box-shadow: 0 0 30px rgba(255, 102, 196, 0.2), inset 0 0 15px rgba(139, 92, 246, 0.15);
        }
        .neon-btn {
            background: linear-gradient(135deg, rgba(255,102,196,0.25), rgba(139,92,246,0.35));
            border: 1px solid rgba(255, 102, 196, 0.6);
            transition: all 0.2s ease;
        }
        .neon-btn:hover, .neon-btn.active {
            background: linear-gradient(135deg, rgba(255,102,196,0.45), rgba(139,92,246,0.55));
            border-color: #ff66c4;
            box-shadow: 0 0 20px rgba(255, 102, 196, 0.6);
            transform: translateY(-2px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-4 sm:p-8 relative select-none">

    <!-- Верхняя панель -->
    <header class="flex justify-between items-center z-10">
        <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></span>
            <span class="font-anime text-xs text-pink-300 tracking-wider">ALYA_GALLERY.exe</span>
        </div>
        
        <!-- Кнопка музыки -->
        <button id="audio-toggle" class="glass-panel px-4 py-2 rounded-xl text-xs font-semibold text-pink-300 hover:text-white flex items-center gap-2 neon-btn">
            <span>🎵 Музыка: <span id="audio-status">ВЫКЛ</span></span>
        </button>
    </header>

    <!-- Центральная область (Арт Али и переключатель) -->
    <main class="flex-1 flex flex-col items-center justify-center relative my-2">
        <div id="character-container" class="relative flex flex-col items-center animate-float">
            <div class="absolute -bottom-6 w-52 h-10 bg-pink-500/40 rounded-full blur-2xl"></div>
            
            <!-- Контейнер картинки -->
            <div class="w-56 h-56 sm:w-72 sm:h-72 rounded-3xl glass-panel flex flex-col items-center justify-center relative overflow-hidden group border-pink-500/60 shadow-[0_0_40px_rgba(255,102,196,0.3)]">
                <div class="absolute inset-0 bg-gradient-to-t from-purple-900/40 to-transparent z-10 pointer-events-none"></div>
                
                <!-- Картинка лежит рядом с html в папке public -->
                <img id="alya-image" src="" alt="Alya" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                
                <span class="absolute bottom-3 z-20 font-anime text-xs text-pink-200 tracking-widest bg-black/70 px-3 py-1 rounded-full border border-pink-500/30">
                    АЛЯ САН
                </span>
            </div>
        </div>

        <!-- Мини-панель выбора поз -->
        <div id="poses-bar" class="flex gap-2 mt-4 z-20 overflow-x-auto max-w-full py-1 px-2">
            <!-- Кнопки генерируются скриптом автоматически -->
        </div>

        <!-- Контейнер для выборов в диалоге -->
        <div id="choices-container" class="absolute bottom-4 flex flex-col gap-2.5 w-full max-w-md z-20 hidden"></div>
    </main>

    <!-- Нижняя панель (Диалоговое окно) -->
    <footer class="w-full max-w-4xl mx-auto z-10">
        <div class="glass-panel rounded-2xl p-4 sm:p-6 relative cursor-pointer shadow-2xl" id="dialogue-box">
            <div class="absolute -top-3.5 left-6 bg-gradient-to-r from-pink-600 to-purple-600 px-4 py-1 rounded-full border border-pink-300/40 shadow-lg">
                <span id="char-name" class="font-anime text-xs sm:text-sm text-white tracking-wider">Аля</span>
            </div>

            <div class="min-h-[50px] sm:min-h-[64px] flex items-center pt-2">
                <p id="dialogue-text" class="text-sm sm:text-base text-gray-200 leading-relaxed font-medium"></p>
            </div>

            <div class="text-right mt-1">
                <span class="text-[10px] text-pink-400 animate-pulse font-anime">▼ Кликни, чтобы продолжить</span>
            </div>
        </div>
    </footer>

    <!-- Фоновая музыка -->
    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- ЗВУКОВОЙ СИНТЕЗАТОР КЛИКОВ ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(650, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // --- ФАЙЛЫ ИЗ ПАПКИ PUBLIC ---
        const alyaData = [
            { file: "d3266df1bf85e1829fd468d77c617baf.jpg", quote: "Эй! Кудзэ-кун, ты вообще слушаешь, что я говорю?" },
            { file: "5551c576b59560f27abb4388ccf51308.jpg", quote: "И... ничего я не смущаюсь! (Полный идиот...)" },
            { file: "4273151b18c2ac7ba27173238f5eece.jpg", quote: "Hontou ni... (Ты иногда такой невозможный)." },
            { file: "33fa168045c04487e83fb4c3558acd9c.jpg", quote: "Хм! Мог бы и побыстрее соображать!" },
            { file: "5960767d5ef5b43674513f0c7236f650.jpg", quote: "Ну хорошо, сегодня я разрешаю тебе побыть со мной." },
            { file: "55e682878015ac8b7cdfd8a449ac1aff.jpg", quote: "Береги себя! И... спасибо, что заглянул." }
        ];

        let currentIndex = 0;
        let isTyping = false;
        let charIndex = 0;
        let timer = null;

        const imgElement = document.getElementById('alya-image');
        const textElement = document.getElementById('dialogue-text');
        const dialogueBox = document.getElementById('dialogue-box');
        const posesBar = document.getElementById('poses-bar');

        function initPosesBar() {
            posesBar.innerHTML = "";
            alyaData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `neon-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-white whitespace-nowrap ${index === currentIndex ? 'active' : ''}`;
                btn.textContent = `Арт #${index + 1}`;
                btn.onclick = () => {
                    playClickSound();
                    setAlyaPose(index);
                };
                posesBar.appendChild(btn);
            });
        }

        function setAlyaPose(index) {
            currentIndex = index;
            imgElement.src = alyaData[currentIndex].file;
            typeWriter(alyaData[currentIndex].quote);
            
            const buttons = posesBar.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                if (idx === currentIndex) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function typeWriter(text) {
            textElement.textContent = "";
            charIndex = 0;
            isTyping = true;

            function addChar() {
                if (charIndex < text.length) {
                    textElement.textContent += text.charAt(charIndex);
                    charIndex++;
                    timer = setTimeout(addChar, 25);
                } else {
                    isTyping = false;
                }
            }
            addChar();
        }

        dialogueBox.addEventListener('click', () => {
            playClickSound();
            if (isTyping) {
                clearTimeout(timer);
                textElement.textContent = alyaData[currentIndex].quote;
                isTyping = false;
            } else {
                let nextIndex = (currentIndex + 1) % alyaData.length;
                setAlyaPose(nextIndex);
            }
        });

        // Музыка
        const bgm = document.getElementById('bgm');
        const audioToggle = document.getElementById('audio-toggle');
        const audioStatus = document.getElementById('audio-status');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', () => {
            playClickSound();
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                bgm.play().catch(() => {});
                audioStatus.textContent = "ВКЛ";
                audioToggle.classList.add("border-pink-400", "shadow-[0_0_15px_rgba(255,102,196,0.5)]");
            } else {
                bgm.pause();
                audioStatus.textContent = "ВЫКЛ";
                audioToggle.classList.remove("border-pink-400", "shadow-[0_0_15px_rgba(255,102,196,0.5)]");
            }
        });

        window.onload = () => {
            initPosesBar();
            setAlyaPose(0);
        };
    </script>
</body>
</html>
