<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy & Alien Planets Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #030014;
            color: #f1f5f9;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }
        .font-space {
            font-family: 'Orbitron', sans-serif;
        }
        /* Звездное небо */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop') repeat;
            animation: moveStars 100s linear infinite;
            z-index: 0;
            opacity: 0.4;
        }
        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }
        /* Стили планет */
        .planet {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            cursor: pointer;
        }
        .planet:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.8));
        }
        /* Анимация зума галактики */
        .galaxy-map {
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
            transform-origin: center center;
        }
        .zoomed-in {
            transform: scale(3.5);
            opacity: 0;
            pointer-events: none;
        }
        /* Панель информации о планете */
        #planet-info {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100px);
            opacity: 0;
            pointer-events: none;
        }
        #planet-info.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.25);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-6 relative select-none">

    <!-- Звездный фон -->
    <div class="stars"></div>

    <!-- Шапка -->
    <header class="flex justify-between items-center z-20">
        <div class="glass-panel px-5 py-2.5 rounded-2xl flex items-center gap-3">
            <span class="w-3.5 h-3.5 rounded-full bg-cyan-400 animate-ping"></span>
            <span class="font-space text-sm text-cyan-300 tracking-widest font-bold">GALAXY_SECTOR_7G</span>
        </div>
        <button id="back-btn" class="glass-panel px-5 py-2.5 rounded-2xl text-xs font-space text-purple-300 hover:text-white hidden transition-all hover:bg-purple-900/50">
            🌌 НАЗАД В ГАЛАКТИКУ
        </button>
    </header>

    <!-- Основная карта галактики (Солнечная система / Планеты) -->
    <main id="galaxy-container" class="flex-1 flex items-center justify-center relative z-10 galaxy-map">
        <div class="absolute w-full h-full flex items-center justify-around max-w-5xl px-12">
            
            <!-- Планета 1: Земля -->
            <div onclick="zoomToPlanet('earth')" class="planet flex flex-col items-center group">
                <div class="w-32 h-32 md:w-44 md:h-44 rounded-full overflow-hidden shadow-[0_0_30px_rgba(59,130,246,0.5)] border-2 border-blue-400/50 relative">
                    <img src="https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=500&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <span class="mt-3 font-space text-xs md:text-sm text-blue-300 tracking-wider group-hover:text-white">ЗЕМЛЯ (КОЛЫБЕЛЬ)</span>
            </div>

            <!-- Планета 2: Экзопланета (Землеподобная) -->
            <div onclick="zoomToPlanet('kepler')" class="planet flex flex-col items-center group">
                <div class="w-28 h-28 md:w-36 md:h-36 rounded-full overflow-hidden shadow-[0_0_30px_rgba(234,179,8,0.5)] border-2 border-yellow-400/50 relative">
                    <img src="https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=500&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <span class="mt-3 font-space text-xs md:text-sm text-yellow-300 tracking-wider group-hover:text-white">КЕПЛЕР-442b</span>
            </div>

            <!-- Планета 3: Планета Инопланетян -->
            <div onclick="zoomToPlanet('alien')" class="planet flex flex-col items-center group">
                <div class="w-36 h-36 md:w-48 md:h-48 rounded-full overflow-hidden shadow-[0_0_40px_rgba(236,72,153,0.7)] border-2 border-pink-500/80 relative animate-pulse">
                    <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=500&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <span class="mt-3 font-space text-xs md:text-sm text-pink-300 tracking-wider group-hover:text-white">КСЕНОН (ИНОПЛАНЕТЯНЕ)</span>
            </div>

        </div>
    </main>

    <!-- Панель информации при приближении к планете -->
    <footer id="planet-info" class="absolute bottom-10 left-1/2 -translate-x-1/2 w-full max-w-2xl z-20 px-4">
        <div class="glass-panel rounded-3xl p-6 md:p-8 flex flex-col gap-4 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex justify-between items-center border-b border-purple-500/30 pb-3">
                <h2 id="info-title" class="font-space text-xl md:text-2xl text-pink-400 font-bold">Название планеты</h2>
                <span id="info-status" class="text-xs font-space px-3 py-1 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-300">Статус: Активно</span>
            </div>

            <p id="info-desc" class="text-sm md:text-base text-gray-300 leading-relaxed">
                Описание планеты и ее обитателей...
            </p>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="resetZoom()" class="px-5 py-2 rounded-xl font-space text-xs bg-purple-900/60 hover:bg-purple-800 border border-purple-500/50 text-white transition-all">
                    ВЕРНУТСЯ В КОСМОС
                </button>
            </div>
        </div>
    </footer>

    <script>
        const galaxyContainer = document.getElementById('galaxy-container');
        const planetInfo = document.getElementById('planet-info');
        const backBtn = document.getElementById('back-btn');
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');

        // Данные о планетах
        const planetsData = {
            earth: {
                title: "🌍 ЗЕМЛЯ (Сектор 00-Alpha)",
                desc: "Родная колыбельная планета человечества. Богата жидкой водой, густой атмосферой и разнообразной биосферой. В данный момент здесь активно развиваются технологии межпланетных перелетов."
            },
            kepler: {
                title: "🌕 КЕПЛЕР-442b (Землеподобный мир)",
                desc: "Экзопланета в обитаемой зоне своей звезды. Ландшафт покрыт огромными биолюминесцентными лесами и кристальными океанами. Отличный кандидат для колонизации."
            },
            alien: {
                title: "👽 КСЕНОН (Дом Инопланетной Цивилизации)",
                desc: "Загадочный мир с фиолетовым небом и плавающими островами. Здесь обитает высокоразвитая раса разумных существ, создавших сеть квантовых маяков по всей галактике."
            }
        };

        function zoomToPlanet(planetKey) {
            // Эффект приближения галактики
            galaxyContainer.classList.add('zoomed-in');
            backBtn.classList.remove('hidden');

            // Заполняем данные
            infoTitle.textContent = planetsData[planetKey].title;
            infoDesc.textContent = planetsData[planetKey].desc;

            // Показываем информационную панель через небольшую паузу
            setTimeout(() => {
                planetInfo.classList.add('active');
            }, 400);
        }

        function resetZoom() {
            // Убираем зум и панель
            planetInfo.classList.remove('active');
            backBtn.classList.add('hidden');
            
            setTimeout(() => {
                galaxyContainer.classList.remove('zoomed-in');
            }, 200);
        }

        backBtn.addEventListener('click', resetZoom);
    </script>
</body>
</html>
