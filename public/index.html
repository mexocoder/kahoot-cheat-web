        {

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        lucide.createIcons();

        // 1. SCENE & RENDERER SETUP (FIXED BLACK BACKGROUND)
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0004);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 12, 60);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false,
            powerPreference: "high-performance"
        });
        renderer.setClearColor(0x000000, 1.0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 16;
        controls.maxDistance = 160;

        // 2. SIRIUS PROCEDURAL TEXTURE GENERATOR (WHITE/SILVER/BLACK MONO)
        function createSiriusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Monochrome dark-to-light gradient background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, '#d1d5db');
            grad.addColorStop(0.7, '#9ca3af');
            grad.addColorStop(1, '#ffffff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Granular plasma noise (monochrome/silver contrast)
            for (let i = 0; i < 50000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 1.8 + 0.4;
                const opacity = Math.random() * 0.7;
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = Math.random() > 0.4 
                    ? `rgba(255, 255, 255, ${opacity})` 
                    : `rgba(30, 35, 45, ${opacity * 0.8})`;
                ctx.fill();
            }

            // Dark plasma spots
            for (let i = 0; i < 16; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.7) + canvas.height * 0.15;
                const r = Math.random() * 10 + 3;
                
                const spotGrad = ctx.createRadialGradient(x, y, 1, x, y, r);
                spotGrad.addColorStop(0, 'rgba(10, 12, 18, 0.9)');
                spotGrad.addColorStop(0.6, 'rgba(60, 65, 75, 0.4)');
                spotGrad.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = spotGrad;
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const siriusTexture = createSiriusTexture();
        siriusTexture.wrapS = THREE.RepeatWrapping;
        siriusTexture.wrapT = THREE.ClampToEdgeWrapping;

        // 3. SHADERS FOR SIRIUS A PLASMA & DISPLACEMENT
        const sunVertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            uniform float uTime;
            uniform float uPlasmaSpeed;

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vPosition = position;

                float noise = snoise(position * 0.18 + vec3(uTime * uPlasmaSpeed * 0.25));
                vec3 newPosition = position + normal * noise * 0.3;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const sunFragmentShader = `
            uniform sampler2D uTexture;
            uniform float uTime;
            uniform float uPlasmaSpeed;
            uniform vec3 uColorTint;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec2 animatedUv = vUv;
                animatedUv.x += sin(vUv.y * 25.0 + uTime * uPlasmaSpeed * 0.4) * 0.003;
                animatedUv.y += cos(vUv.x * 25.0 + uTime * uPlasmaSpeed * 0.4) * 0.003;

                vec4 texColor = texture2D(uTexture, animatedUv);
                
                vec3 viewDir = normalize(-vPosition);
                float limb = 1.0 - max(0.0, dot(viewDir, vNormal));
                limb = pow(limb, 0.7);

                vec3 finalColor = texColor.rgb * uColorTint;
                finalColor += uColorTint * limb * 0.6; // High intensity silver/white rim

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const starRadius = 11.5;
        const starGeometry = new THREE.SphereGeometry(starRadius, 64, 64);
        
        const starUniforms = {
            uTexture: { value: siriusTexture },
            uTime: { value: 0 },
            uPlasmaSpeed: { value: 1.0 },
            uColorTint: { value: new THREE.Color(0xffffff) }
        };

        const starMaterial = new THREE.ShaderMaterial({
            vertexShader: sunVertexShader,
            fragmentShader: sunFragmentShader,
            uniforms: starUniforms
        });

        const starMesh = new THREE.Mesh(starGeometry, starMaterial);
        scene.add(starMesh);

        // 4. ATMOSPHERIC CORONA (ICE-BLUE/WHITE SILVERY GLOW)
        const coronaVertexShader = `
            varying vec3 vNormal;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const coronaFragmentShader = `
            varying vec3 vNormal;
            uniform vec3 uGlowColor;
            uniform float uIntensity;

            void main() {
                float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.2) * uIntensity;
                gl_FragColor = vec4(uGlowColor, intensity);
                       }
        `;

        const coronaGeometry = new THREE.SphereGeometry(starRadius * 1.32, 64, 64);
        const coronaMaterial = new THREE.ShaderMaterial({
            vertexShader: coronaVertexShader,
            fragmentShader: coronaFragmentShader,
            uniforms: {
                uGlowColor: { value: new THREE.Color(0xd1e8ff) },
                uIntensity: { value: 1.4 }
            },
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true,
            depthWrite: false
        });

        const coronaMesh = new THREE.Mesh(coronaGeometry, coronaMaterial);
        scene.add(coronaMesh);

        // 5. OUTER CORONA HALO
        const haloGeometry = new THREE.SphereGeometry(starRadius * 1.6, 64, 64);
        const haloMaterial = new THREE.MeshBasicMaterial({
            color: new THREE.Color(0xa5f3fc),
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.12,
            side: THREE.BackSide,
            depthWrite: false
        });
        const haloMesh = new THREE.Mesh(haloGeometry, haloMaterial);
        scene.add(haloMesh);

        // 6. STELLAR DUST & IONIZED PARTICLES
        const particlesCount = 800;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particlesCount * 3);
        const particleScales = new Float32Array(particlesCount);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = starRadius * 1.5 + Math.random() * 35.0;

            particlePositions[i] = r * Math.sin(phi) * Math.cos(theta);
            particlePositions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            particlePositions[i + 2] = r * Math.cos(phi);

            particleScales[i / 3] = Math.random() * 2.5 + 0.5;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        // Create glowing circular particle sprite
        const particleCanvas = document.createElement('canvas');
        particleCanvas.width = 64;
        particleCanvas.height = 64;
        const pCtx = particleCanvas.getContext('2d');
        const pGrad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        pGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        pGrad.addColorStop(0.4, 'rgba(165, 243, 252, 0.6)');
        pGrad.addColorStop(1, 'transparent');
        pCtx.fillStyle = pGrad;
        pCtx.fillRect(0, 0, 64, 64);

        const particleTexture = new THREE.CanvasTexture(particleCanvas);

        const particleMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.9,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const particlesSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particlesSystem);

        // 7. BACKGROUND STARRY FIELD
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starsPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            starsPositions[i] = (Math.random() - 0.5) * 800;
            starsPositions[i + 1] = (Math.random() - 0.5) * 800;
            starsPositions[i + 2] = (Math.random() - 0.5) * 800;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xcccccc,
            size: 1.2,
            transparent: true,
            opacity: 0.7
        });
        const starsField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starsField);

        // 8. ANIMATION LOOP & STATE
        let isPaused = false;
        let rotationSpeedMultiplier = 1.0;
        let plasmaSpeedMultiplier = 1.0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (!isPaused) {
                const elapsedTime = clock.getElapsedTime();
                starUniforms.uTime.value = elapsedTime;

                // Rotate star mesh
                starMesh.rotation.y += 0.003 * rotationSpeedMultiplier;

                // Rotate outer atmospheres slightly off-axis for depth
                coronaMesh.rotation.y -= 0.001 * rotationSpeedMultiplier;
                haloMesh.rotation.y += 0.0015 * rotationSpeedMultiplier;

                // Rotate particle cloud slowly
                particlesSystem.rotation.y += 0.0008 * rotationSpeedMultiplier;
                particlesSystem.rotation.x += 0.0003 * rotationSpeedMultiplier;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 9. UI INTERACTION & EVENT HANDLERS
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mobile UI Panel Toggle
        const btnToggleUi = document.getElementById('btn-toggle-ui');
        const controlsBody = document.getElementById('controls-body');
        const uiArrow = document.getElementById('ui-arrow');
        let uiExpanded = true;

        if (btnToggleUi) {
            btnToggleUi.addEventListener('click', () => {
                uiExpanded = !uiExpanded;
                controlsBody.style.display = uiExpanded ? 'flex' : 'none';
                uiArrow.style.transform = uiExpanded ? 'rotate(0deg)' : 'rotate(-180deg)';
            });
        }

        // Color Presets logic
        const colorPresets = document.querySelectorAll('.color-preset');
        colorPresets.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorPresets.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const mode = btn.getAttribute('data-color');
                if (mode === 'sirius') {
                    starUniforms.uColorTint.value.setHex(0xffffff);
                    coronaMaterial.uniforms.uGlowColor.value.setHex(0xd1e8ff);
                    haloMaterial.color.setHex(0xa5f3fc);
                } else if (mode === 'ice') {
                    starUniforms.uColorTint.value.setHex(0xa5f3fc);
                    coronaMaterial.uniforms.uGlowColor.value.setHex(0x38bdf8);
                    haloMaterial.color.setHex(0x0284c7);
                } else if (mode === 'mono') {
                    starUniforms.uColorTint.value.setHex(0x9ca3af);
                    coronaMaterial.uniforms.uGlowColor.value.setHex(0xe5e7eb);
                    haloMaterial.color.setHex(0x6b7280);
                }
            });
        });

        // Sliders
        const sliderRotation = document.getElementById('slider-rotation');
        const valRotation = document.getElementById('val-rotation');
        sliderRotation.addEventListener('input', (e) => {
            rotationSpeedMultiplier = parseFloat(e.target.value);
            valRotation.textContent = rotationSpeedMultiplier.toFixed(1) + 'x';
        });

        const sliderGlow = document.getElementById('slider-glow');
        const valGlow = document.getElementById('val-glow');
        sliderGlow.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            coronaMaterial.uniforms.uIntensity.value = val;
            haloMaterial.opacity = 0.08 * (val / 1.4);
            valGlow.textContent = val.toFixed(1) + 'x';
        });

        const sliderPlasma = document.getElementById('slider-plasma');
        const valPlasma = document.getElementById('val-plasma');
        sliderPlasma.addEventListener('input', (e) => {
            plasmaSpeedMultiplier = parseFloat(e.target.value);
            starUniforms.uPlasmaSpeed.value = plasmaSpeedMultiplier;
            valPlasma.textContent = plasmaSpeedMultiplier.toFixed(1) + 'x';
        });

        // Toggles & Buttons
        const btnToggleParticles = document.getElementById('btn-toggle-particles');
        let particlesVisible = true;
        btnToggleParticles.addEventListener('click', () => {
            particlesVisible = !particlesVisible;
            particlesSystem.visible = particlesVisible;
            btnToggleParticles.classList.toggle('active', particlesVisible);
        });

        const btnPause = document.getElementById('btn-pause');
        const iconPause = document.getElementById('icon-pause');
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.classList.toggle('active', isPaused);
            iconPause.setAttribute('data-lucide', isPaused ? 'play' : 'pause');
            lucide.createIcons();
        });

        const btnResetCam = document.getElementById('btn-reset-cam');
        btnResetCam.addEventListener('click', () => {
            camera.position.set(0, 12, 60);
            controls.target.set(0, 0, 0);
            controls.update();
        });
    </script>
</body>
</html>
