<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Солнечная Система</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020208;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Меню планет */
        .planets-menu {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            width: 135px;
        }

        .planets-menu::-webkit-scrollbar {
            width: 3px;
        }
        .planets-menu::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn:active {
            transform: scale(0.96);
        }

        .menu-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Кнопка скрыть/показать инфо */
        .toggle-info-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 11;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #38bdf8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Панель информации */
        .info-panel {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: calc(100vw - 24px);
            max-width: 340px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .info-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .info-panel h2 {
            font-size: 20px;
            color: #38bdf8;
        }

        .info-panel .subtitle {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 8px;
            border-radius: 10px;
        }

        .stat-card .label {
            font-size: 9px;
            color: #64748b;
            display: block;
        }

        .stat-card .val {
            font-size: 11px;
            font-weight: bold;
            color: #f1f5f9;
        }

        .description {
            font-size: 11px;
            line-height: 1.4;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 10px;
            border-radius: 10px;
            border-left: 2px solid #38bdf8;
        }

        @media (min-width: 600px) {
            .info-panel {
                top: 12px;
                bottom: auto;
                width: 300px;
            }
            .planets-menu {
                width: 145px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="webgl-container"></div>

<button class="toggle-info-btn" id="toggleInfo">ℹ️</button>

<div class="planets-menu" id="planetsMenu"></div>

<div class="info-panel" id="infoPanel">
    <div class="info-header">
        <h2 id="pName">Солнечная Система</h2>
        <span class="subtitle" id="pType">Звездная система</span>
    </div>
    <div class="info-grid">
        <div class="stat-card">
            <span class="label">Температура</span>
            <span class="val" id="pTemp">~5 500 °C</span>
        </div>
        <div class="stat-card">
            <span class="label">Диаметр</span>
            <span class="val" id="pSize">1 392 700 км</span>
        </div>
        <div class="stat-card">
            <span class="label">Орбита</span>
            <span class="val" id="pOrbit">Центр</span>
        </div>
        <div class="stat-card">
            <span class="label">Спутники</span>
            <span class="val" id="pMoons">8 планет</span>
        </div>
    </div>
    <p class="description" id="pDesc">
        Полный обзор нашей планетной системы. Нажмите на любую планету в меню, чтобы подлететь к ней.
    </p>
</div>

<script>
    // Генератор процедурных текстур для планет
    function generateTexture(type) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        if (type === 'sun') {
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#ffcc00');
            grad.addColorStop(0.5, '#ff6600');
            grad.addColorStop(1, '#ff3300');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 256);

            for (let i = 0; i < 400; i++) {
                ctx.fillStyle = `rgba(255, 255, 200, ${Math.random() * 0.3})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 15, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (type === 'earth') {
            ctx.fillStyle = '#1c4273';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#2d6a4f';
            for (let i = 0; i < 40; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 40 + 10, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 30; i++) {
                ctx.fillRect(Math.random() * 512, Math.random() * 256, Math.random() * 80 + 20, Math.random() * 15 + 5);
            }
        } else if (type === 'jupiter') {
            ctx.fillStyle = '#c99a65';
            ctx.fillRect(0, 0, 512, 256);
            for (let y = 0; y < 256; y += 12) {
                ctx.fillStyle = (y % 24 === 0) ? '#a36d3b' : '#e0be92';
                ctx.fillRect(0, y + (Math.sin(y)*4), 512, 8);
            }
            // Большое красное пятно
            ctx.fillStyle = '#b53d27';
            ctx.beginPath();
            ctx.ellipse(300, 160, 30, 18, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 'saturn') {
            ctx.fillStyle = '#e3c896';
            ctx.fillRect(0, 0, 512, 256);
            for (let y = 0; y < 256; y += 8) {
                ctx.fillStyle = (y % 16 === 0) ? '#cbb07f' : '#edd8b1';
                ctx.fillRect(0, y, 512, 4);
            }
        } else if (type === 'mars') {
            ctx.fillStyle = '#9e3820';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#732613';
            for (let i = 0; i < 50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 20 + 5, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            // Для остальных планет (кратеры/полосы)
            const colors = {
                mercury: ['#787878', '#525252'],
                venus: ['#d1a25a', '#b8863b'],
                uranus: ['#52b7d6', '#3b91aa'],
                neptune: ['#2842a3', '#1c2f78'],
                pluto: ['#9c8e80', '#6e6357']
            };
            const pair = colors[type] || ['#888888', '#555555'];
            ctx.fillStyle = pair[0];
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = pair[1];
            for (let i = 0; i < 60; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 15 + 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const texture = new THREE.CanvasTexture(canvas);
        return texture;
    }

    // Данные планет + режим всей системы
    const celestialData = [
        { id: 'system', name: '🌌 Вся система', type: 'Общий обзор', color: 0x38bdf8, size: 0, dist: 0, speed: 0, temp: 'Разная', sizeKm: '12 млрд км', orbit: 'Солнечная', moons: '200+', desc: 'Вид на всю Солнечную систему сверху. Все планеты вращаются по своим уникальным орбитам.' },
        { id: 'sun', name: 'Солнце', type: 'Желтый карлик', color: 0xffaa00, size: 10, dist: 0, speed: 0, temp: '5 500 °C', sizeKm: '1 392 700 км', orbit: 'Центр', moons: '8 планет', desc: 'Центральная звезда нашей системы, содержащая 99.86% всей ее массы.' },
        { id: 'mercury', name: 'Меркурий', type: 'Планета', color: 0xa0a0a0, size: 1.2, dist: 22, speed: 0.03, temp: '-180..430 °C', sizeKm: '4 879 км', orbit: '88 дней', moons: '0', desc: 'Самая близкая к Солнцу и самая маленькая планета системы.' },
        { id: 'venus', name: 'Венера', type: 'Планета', color: 0xe3bb76, size: 2.0, dist: 34, speed: 0.02, temp: '+464 °C', sizeKm: '12 104 км', orbit: '225 дней', moons: '0', desc: 'Самая горячая планета из-за плотной атмосферы и парникового эффекта.' },
        { id: 'earth', name: 'Земля', type: 'Планета', color: 0x3b82f6, size: 2.2, dist: 48, speed: 0.015, temp: '+15 °C', sizeKm: '12 742 км', orbit: '365 дней', moons: '1', desc: 'Наш дом — единственная планета, где точно известна жизнь.' },
        { id: 'mars', name: 'Марс', type: 'Планета', color: 0xef4444, size: 1.5, dist: 62, speed: 0.01, temp: '-63 °C', sizeKm: '6 779 км', orbit: '687 дней', moons: '2', desc: 'Красная планета с высочайшей горой Олимп и каньонами.' },
        { id: 'jupiter', name: 'Юпитер', type: 'Газовый гигант', color: 0xd97706, size: 5.0, dist: 88, speed: 0.007, temp: '-110 °C', sizeKm: '139 820 км', orbit: '12 лет', moons: '95', desc: 'Крупнейшая планета системы с Большим Красным Пятном.' },
        { id: 'saturn', name: 'Сатурн', type: 'Газовый гигант', color: 0xfde047, size: 4.2, dist: 120, speed: 0.005, temp: '-140 °C', sizeKm: '116 460 км', orbit: '29 лет', moons: '146', desc: 'Знаменит своей величественной системой ледяных колец.' },
        { id: 'uranus', name: 'Уран', type: 'Ледяной гигант', color: 0x06b6d4, size: 3.2, dist: 150, speed: 0.003, temp: '-195 °C', sizeKm: '50 724 км', orbit: '84 года', moons: '28', desc: 'Вращается «на боку» из-за древнего столкновения.' },
        { id: 'neptune', name: 'Нептун', type: 'Ледяной гигант', color: 0x1d4ed8, size: 3.0, dist: 180, speed: 0.002, temp: '-200 °C', sizeKm: '49 244 км', orbit: '165 лет', moons: '16', desc: 'Самая далекая планета с сильнейшими ветрами.' },
        { id: 'pluto', name: 'Плутон', type: 'Карлик', color: 0x94a3b8, size: 0.9, dist: 205, speed: 0.001, temp: '-229 °C', sizeKm: '2 376 км', orbit: '248 лет', moons: '5', desc: 'Карликовая планета на краю системы с ледяным сердцем.' }
    ];

    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 150, 320);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 700;

    const ambientLight = new THREE.AmbientLight(0x555566, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Звездный фон
    function createStars() {
        const geometry = new THREE.BufferGeometry();
        const count = 3500;
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 1200;
            positions[i+1] = (Math.random() - 0.5) * 1200;
            positions[i+2] = (Math.random() - 0.5) * 1200;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 1.0, color: 0xffffff, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(geometry, material));
    }
    createStars();

    const celestialObjects = [];
    let selectedObject = null;
    let isTransitioning = false;
    const targetCameraPos = new THREE.Vector3();
    const targetLookAt = new THREE.Vector3();

    // Создание 3D тел
    celestialData.forEach((data) => {
        if (data.id === 'system') {
            celestialObjects.push({ data: data, mesh: null });
            return;
        }

        const pivot = new THREE.Group();
        scene.add(pivot);

        let mesh;
        const texture = generateTexture(data.id);

        if (data.id === 'sun') {
            const geo = new THREE.SphereGeometry(data.size, 32, 32);
            const mat = new THREE.MeshBasicMaterial({ map: texture });
            mesh = new THREE.Mesh(geo, mat);
        } else {
            const geo = new THREE.SphereGeometry(data.size, 32, 32);
            const mat = new THREE.MeshPhongMaterial({ 
                map: texture, 
                shininess: 10
            });
            mesh = new THREE.Mesh(geo, mat);

            if (data.id === 'saturn') {
                const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 2.2, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.2;
                mesh.add(ring);
            }

            const orbitGeo = new THREE.BufferGeometry();
            const points = [];
            for (let i = 0; i <= 64; i++) {
                const theta = (i / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * data.dist, 0, Math.sin(theta) * data.dist));
            }
            orbitGeo.setFromPoints(points);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 });
            scene.add(new THREE.Line(orbitGeo, orbitMat));
        }

        mesh.position.x = data.dist;
        pivot.add(mesh);

        celestialObjects.push({
            data: data,
            mesh: mesh,
            pivot: pivot,
            angle: Math.random() * Math.PI * 2
        });
    });

    // Генерация меню
    const menuEl = document.getElementById('planetsMenu');
    celestialData.forEach((data, index) => {
        const btn = document.createElement('button');
        btn.className = `menu-btn ${index === 0 ? 'active' : ''}`;
        
        if (data.id === 'system') {
            btn.innerHTML = `${data.name}`;
        } else {
            btn.innerHTML = `<span class="dot" style="background-color: #${data.color.toString(16).padStart(6, '0')}"></span> ${data.name}`;
        }
        
        btn.addEventListener('click', () => selectPlanet(index));
        menuEl.appendChild(btn);
    });

    function selectPlanet(index) {
        document.querySelectorAll('.menu-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        const target = celestialObjects[index];
        selectedObject = target;

        document.getElementById('pName').innerText = target.data.name;
        document.getElementById('pType').innerText = target.data.type;
        document.getElementById('pTemp').innerText = target.data.temp;
        document.getElementById('pSize').innerText = target.data.sizeKm;
        document.getElementById('pOrbit').innerText = target.data.orbit;
        document.getElementById('pMoons').innerText = target.data.moons;
        document.getElementById('pDesc').innerText = target.data.desc;

        isTransitioning = true;
    }

    // Стартуем с режима всей системы
    selectedObject = celestialObjects[0];

    const infoPanel = document.getElementById('infoPanel');
    document.getElementById('toggleInfo').addEventListener('click', () => {
        infoPanel.classList.toggle('hidden');
    });

    function animate() {
        requestAnimationFrame(animate);

        celestialObjects.forEach(obj => {
            if (obj.mesh && obj.data.speed > 0) {
                obj.angle += obj.data.speed * 0.2;
                obj.mesh.position.x = Math.cos(obj.angle) * obj.data.dist;
                obj.mesh.position.z = Math.sin(obj.angle) * obj.data.dist;
            }
            if (obj.mesh) {
                obj.mesh.rotation.y += 0.008;
            }
        });

        if (selectedObject) {
            if (selectedObject.data.id === 'system') {
                // Вид на всю систему
                targetCameraPos.set(0, 180, 260);
                targetLookAt.set(0, 0, 0);
            } else {
                const worldPos = new THREE.Vector3();
                selectedObject.mesh.getWorldPosition(worldPos);

                const isMobile = window.innerWidth < 600;
                let distMultiplier = isMobile ? 5.5 : 4.0;
                
                // Специальный отступ для Солнца
                if (selectedObject.data.id === 'sun') {
                    distMultiplier = isMobile ? 7.5 : 5.5;
                }

                const offsetDistance = selectedObject.data.size * distMultiplier + 10;
                           
                targetCameraPos.set(
                    worldPos.x + offsetDistance * 0.7,
                    worldPos.y + offsetDistance * 0.4,
                    worldPos.z + offsetDistance * 0.7
                );
                targetLookAt.copy(worldPos);
            }

            if (isTransitioning) {
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                if (camera.position.distanceTo(targetCameraPos) < 0.8) {
                    isTransitioning = false;
                }
            } else if (selectedObject.mesh) {
                controls.target.copy(targetLookAt);
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
