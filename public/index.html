<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Visual Novel UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            color: #f1f5f9;
            overflow: hidden;
        }
        .font-anime {
            font-family: 'Mochiy Pop One', sans-serif;
        }
        .glass-panel {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 102, 196, 0.3);
            box-shadow: 0 0 25px rgba(255, 102, 196, 0.15), inset 0 0 15px rgba(139, 92, 246, 0.1);
        }
        .neon-btn {
            background: linear-gradient(135deg, rgba(255,102,196,0.2), rgba(139,92,246,0.3));
            border: 1px solid rgba(255, 102, 196, 0.5);
            transition: all 0.2s ease;
        }
        .neon-btn:hover {
            background: linear-gradient(135deg, rgba(255,102,196,0.4), rgba(139,92,246,0.5));
            border-color: #ff66c4;
            box-shadow: 0 0 15px rgba(255, 102, 196, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-4 sm:p-8 relative select-none">

    <!-- Верхняя панель (Статус / Назад) -->
    <header class="flex justify-between items-center z-10">
        <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></span>
            <span class="font-anime text-xs text-pink-300 tracking-wider">PROJECT: VN_LOCAL</span>
        </div>
        <div class="glass-panel px-4 py-2 rounded-xl text-xs font-semibold text-purple-300">
            Глава 1: Начало пути
        </div>
    </header>

    <!-- Центральная область (Персонаж / Сцена) -->
    <main class="flex-1 flex flex-col items-center justify-center relative my-4">
        <!-- Аниме силуэт / Карточка персонажа -->
        <div id="character-container" class="relative transition-all duration-500 flex flex-col items-center">
            <!-- Эффект свечения под персонажем -->
            <div class="absolute -bottom-6 w-48 h-8 bg-pink-500/30 rounded-full blur-xl"></div>
            
            <!-- Заглушка аватарки в аниме стиле (можно заменить на картинку <img src="...">) -->
            <div class="w-40 h-40 sm:w-56 sm:h-56 rounded-3xl glass-panel flex flex-col items-center justify-center relative overflow-hidden group border-pink-500/50">
                <div class="absolute inset-0 bg-gradient-to-t from-purple-900/40 to-transparent"></div>
                <span class="text-6xl sm:text-7xl group-hover:scale-110 transition-transform duration-300">✨</span>
                <span class="font-anime text-xs text-pink-200 mt-2 tracking-widest">АЙРИС</span>
            </div>
        </div>

        <!-- Контейнер для выборов (появляется в нужный момент) -->
        <div id="choices-container" class="absolute bottom-4 flex flex-col gap-2.5 w-full max-w-md z-20 hidden">
            <!-- Скрипт сюда динамически добавит кнопки выбора -->
        </div>
    </main>

    <!-- Нижняя панель (Диалоговое окно Visual Novel) -->
    <footer class="w-full max-w-4xl mx-auto z-10">
        <div class="glass-panel rounded-2xl p-4 sm:p-6 relative cursor-pointer" id="dialogue-box">
            <!-- Имя персонажа -->
            <div class="absolute -top-3.5 left-6 bg-gradient-to-r from-pink-600 to-purple-600 px-4 py-1 rounded-full border border-pink-300/40 shadow-lg">
                <span id="char-name" class="font-anime text-xs sm:text-sm text-white tracking-wider">Айрис</span>
            </div>

            <!-- Текст реплики -->
            <div class="min-h-[60px] sm:min-h-[72px] flex items-center pt-2">
                <p id="dialogue-text" class="text-sm sm:text-base text-gray-200 leading-relaxed font-medium"></p>
            </div>

            <!-- Подсказка клика -->
            <div class="text-right mt-1">
                <span class="text-[10px] text-pink-400 animate-pulse font-anime">▼ Кликни, чтобы продолжить</span>
            </div>
        </div>
    </footer>

    <!-- Скрипт логики новеллы -->
    <script>
        // Сценарий диалогов
        const story = [
            { name: "Айрис", text: "Оу, привет! Ты наконец-то заглянул в мой проект. Как тебе моя новая локальная страничка?" },
            { name: "Айрис", text: "Здесь можно настроить всё под себя: цвета, музыку, аниме-анимации и даже свои собственные диалоги.", choices: [
                { text: "Выглядит очень круто и стильно!", next: 2 },
                { text: "Научи меня делать такую же красоту на JS!", next: 3 }
            ]},
            { name: "Айрис", text: "Хе-хе, я знала, что тебе понравится! Неон и стекломорфизм — лучшее сочетание для киберпанка.", next: 4 },
            { name: "Айрис", text: "Отличный настрой! Для этого нужен всего лишь HTML, чуточку Tailwind и немного магии JavaScript.", next: 4 },
            { name: "Айрис", text: "Ну что, продолжим кодить или посидим тут еще немного?" }
        ];

        let currentStep = 0;
        let isTyping = false;
        let charIndex = 0;
        let timer = null;

        const textElement = document.getElementById('dialogue-text');
        const nameElement = document.getElementById('char-name');
        const dialogueBox = document.getElementById('dialogue-box');
        const choicesContainer = document.getElementById('choices-container');

        function typeWriter(text) {
            textElement.textContent = "";
            charIndex = 0;
            isTyping = true;
            choicesContainer.classList.add('hidden');

            function addChar() {
                if (charIndex < text.length) {
                    textElement.textContent += text.charAt(charIndex);
                    charIndex++;
                    timer = setTimeout(addChar, 25); // Скорость печати текста
                } else {
                    isTyping = false;
                    checkChoices();
                }
            }
            addChar();
        }

        function showStep(stepIndex) {
            if (stepIndex >= story.length) return;
            currentStep = stepIndex;
            const currentLine = story[currentStep];
            
            nameElement.textContent = currentLine.name;
            typeWriter(currentLine.text);
        }

        function checkChoices() {
            const currentLine = story[currentStep];
            if (currentLine.choices) {
                choicesContainer.innerHTML = "";
                currentLine.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "neon-btn w-full py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold text-white text-left shadow-lg flex items-center justify-between";
                    btn.innerHTML = `<span>${choice.text}</span> <span>✨</span>`;
                    btn.onclick = (e) => {
                        e.stopPropagation(); // чтобы не срабатывал клик по диалогу
                        showStep(choice.next);
                    };
                    choicesContainer.appendChild(btn);
                });
                choicesContainer.classList.remove('hidden');
            }
        }

        // Клик по диалоговому окну для переключения реплик
        dialogueBox.addEventListener('click', () => {
            if (isTyping) {
                // Если текст еще печатается — сразу показываем целиком
                clearTimeout(timer);
                textElement.textContent = story[currentStep].text;
                isTyping = false;
                checkChoices();
            } else {
                // Если есть активные выборы, ждем нажатия на них
                if (story[currentStep].choices) return;

                // Иначе переходим к следующей реплике (если она линейная)
                if (currentStep < story.length - 1 && currentStep !== 1) {
                    showStep(currentStep + 1);
                }
            }
        });

        // Запуск первой реплики при загрузке
        window.onload = () => {
            showStep(0);
        };
    </script>
</body>
</html>
