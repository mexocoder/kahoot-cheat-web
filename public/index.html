<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайны Галактики</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Полупрозрачная палитра под гифку */
            --card-bg: rgba(141, 131, 209, 0.45);
            --accent-card: rgba(90, 80, 153, 0.65);
            --text-dark: #1e173b;
            --text-light: #ffffff;
            --shadow-soft: 8px 8px 20px rgba(0, 0, 0, 0.25), -6px -6px 15px rgba(255, 255, 255, 0.15);
            --shadow-inset: inset 4px 4px 10px rgba(0, 0, 0, 0.3), inset -4px -4px 10px rgba(255, 255, 255, 0.15);
            --glow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 25px 15px;
            overflow-x: hidden;
            position: relative;
            color: var(--text-dark);
        }

        /* Анимированный GIF-фон */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Космическая гифка высочайшего качества */
            background: url('https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZydnA0ZXlyd2Iwbnp1ZjBqMWlzaXRvNWFjMmFubHN3OHB6N2h5eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/U3qYN8S0AY3za/giphy.gif') center/cover no-repeat;
            z-index: -2;
        }

        /* Фиолетовый темный фильтр поверх гифки */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(45, 35, 85, 0.55);
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 1;
        }

        /* Поисковая строка */
        .search-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-inset);
        }

        .search-bar input {
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 700;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: #e2dcff;
        }

        /* Главная карточка */
        .hero-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 35px;
            padding: 28px;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        /* CSS 3D Сатурн вместо ломающихся картинок */
        .floating-planet {
            position: absolute;
            top: -25px;
            right: 10px;
            font-size: 65px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        .title-group h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 38px;
            text-transform: uppercase;
            color: var(--text-light);
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            line-height: 1;
            margin-bottom: 20px;
        }

        .title-group h1 span {
            color: #ffd66b;
            display: block;
            font-size: 28px;
        }

        .info-box {
            background: var(--accent-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 20px;
            color: var(--text-light);
            box-shadow: var(--shadow-soft);
            margin-bottom: 22px;
        }

        .info-box h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffd66b;
        }

        .info-box p {
            font-size: 13.5px;
            line-height: 1.5;
            opacity: 0.95;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            box-shadow: var(--shadow-soft);
            transition: all 0.2s ease;
            flex: 1;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.35);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-inset);
        }

        /* Навигация */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 22px;
            box-shadow: var(--shadow-inset);
        }

        .nav-item {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffd66b;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: var(--glow);
        }

        /* Детали */
        .details-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 25px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-bubble {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 22px;
            padding: 18px;
            box-shadow: var(--shadow-inset);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-light);
            font-weight: 600;
        }

        .scroll-down {
            align-self: center;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            font-weight: 800;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Галерея */
        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .grid-item {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            height: 135px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item .arrow-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="bg-gif"></div>
<div class="bg-overlay"></div>

<div class="container">

    <!-- Поиск -->
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass" style="color: #ffd66b;"></i>
        <input type="text" placeholder="Что такое галактика?">
    </div>

    <!-- Главная секция -->
    <div class="hero-card">
        <div class="floating-planet">🪐</div>

        <div class="title-group">
            <h1>О<span>Галактике</span></h1>
        </div>

        <div class="info-box">
            <h3>ГАЛАКТИКА ЭТО ...</h3>
            <p>Гигантская система из миллиардов звёзд, пыли и тёмной материи. Наш дом — спиральная галактика Млечный Путь!</p>
        </div>

        <div class="btn-group">
            <button class="btn">Войти</button>
            <button class="btn">Создать</button>
        </div>

        <div class="nav-bar">
            <div class="nav-item active"><i class="fa-solid fa-house"></i></div>
            <div class="nav-item"><i class="fa-solid fa-shapes"></i></div>
            <div class="nav-item"><i class="fa-solid fa-gear"></i></div>
            <div class="nav-item"><i class="fa-solid fa-user"></i></div>
        </div>
    </div>

    <!-- Детали -->
    <div class="details-card">
        <div class="chat-bubble">
            ✨ Знаешь ли ты? В видимой Вселенной насчитывается более 2 триллионов галактик!
        </div>

        <div class="scroll-down">
            ЛИСТАЙ НИЖЕ <i class="fa-solid fa-arrow-down"></i>
        </div>
    </div>

    <!-- Галерея -->
    <div class="grid-gallery">
        <div class="grid-item">
            <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=500" alt="Черная дыра">
            <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <div class="grid-item">
            <img src="https://images.unsplash.com/photo-1543722530-d2c3201371e7?w=500" alt="Млечный путь">
            <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <div class="grid-item">
            <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=500" alt="Марс">
            <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <div class="grid-item">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=500" alt="Туманность">
            <div class="arrow-btn"><i class="fa-solid fa-plus"></i></div>
        </div>
    </div>

</div>

</body>
</html>
