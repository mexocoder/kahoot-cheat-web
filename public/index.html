<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Visual Novel - Deluxe Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            color: #f1f5f9;
            overflow: hidden;
        }
        .font-anime {
            font-family: 'Mochiy Pop One', sans-serif;
        }
        .glass-panel {
            background: rgba(15, 15, 25, 0.88);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 102, 196, 0.35);
            box-shadow: 0 0 30px rgba(255, 102, 196, 0.2), inset 0 0 15px rgba(139, 92, 246, 0.15);
        }
        .neon-btn {
            background: linear-gradient(135deg, rgba(255,102,196,0.25), rgba(139,92,246,0.35));
            border: 1px solid rgba(255, 102, 196, 0.6);
            transition: all 0.2s ease;
        }
        .neon-btn:hover {
            background: linear-gradient(135deg, rgba(255,102,196,0.45), rgba(139,92,246,0.55));
            border-color: #ff66c4;
            box-shadow: 0 0 20px rgba(255, 102, 196, 0.6);
            transform: translateY(-2px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-4 sm:p-8 relative select-none">

    <!-- Верхняя панель (Статус / Аудио плеер) -->
    <header class="flex justify-between items-center z-10">
        <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></span>
            <span class="font-anime text-xs text-pink-300 tracking-wider">CYBER_VN.exe</span>
        </div>
        
        <!-- Кнопка музыки -->
        <button id="audio-toggle" class="glass-panel px-4 py-2 rounded-xl text-xs font-semibold text-pink-300 hover:text-white flex items-center gap-2 neon-btn">
            <span>🎵 Музыка: <span id="audio-status">ВЫКЛ</span></span>
        </button>
    </header>

    <!-- Центральная область (Персонаж) -->
    <main class="flex-1 flex flex-col items-center justify-center relative my-4">
        <div id="character-container" class="relative flex flex-col items-center animate-float">
            <!-- Эффект свечения под персонажем -->
            <div class="absolute -bottom-6 w-52 h-10 bg-pink-500/40 rounded-full blur-2xl"></div>
            
            <!-- Аватар персонажа (сюда можно поставить GIF или картинку через <img src="...">) -->
            <div class="w-44 h-44 sm:w-60 sm:h-60 rounded-3xl glass-panel flex flex-col items-center justify-center relative overflow-hidden group border-pink-500/60 shadow-[0_0_40px_rgba(255,102,196,0.3)]">
                <div class="absolute inset-0 bg-gradient-to-t from-purple-900/50 to-transparent"></div>
                <!-- Замените этот блок на <img src="your-gif.gif" class="w-full h-full object-cover"> если найдете GIF -->
                <span class="text-7xl sm:text-8xl group-hover:scale-110 transition-transform duration-300">✨🦊</span>
                <span class="font-anime text-xs text-pink-200 mt-3 tracking-widest bg-black/40 px-3 py-1 rounded-full border border-pink-500/30">АЙРИС [AI]</span>
            </div>
        </div>

        <!-- Контейнер для выборов -->
        <div id="choices-container" class="absolute bottom-4 flex flex-col gap-2.5 w-full max-w-md z-20 hidden"></div>
    </main>

    <!-- Нижняя панель (Диалоговое окно) -->
    <footer class="w-full max-w-4xl mx-auto z-10">
        <div class="glass-panel rounded-2xl p-4 sm:p-6 relative cursor-pointer shadow-2xl" id="dialogue-box">
            <!-- Имя персонажа -->
            <div class="absolute -top-3.5 left-6 bg-gradient-to-r from-pink-600 to-purple-600 px-4 py-1 rounded-full border border-pink-300/40 shadow-lg">
                <span id="char-name" class="font-anime text-xs sm:text-sm text-white tracking-wider">Айрис</span>
            </div>

            <!-- Текст реплики -->
            <div class="min-h-[60px] sm:min-h-[72px] flex items-center pt-2">
                <p id="dialogue-text" class="text-sm sm:text-base text-gray-200 leading-relaxed font-medium"></p>
            </div>

            <!-- Подсказка клика -->
            <div class="text-right mt-1">
                <span class="text-[10px] text-pink-400 animate-pulse font-anime">▼ Кликни, чтобы продолжить</span>
            </div>
        </div>
    </footer>

    <!-- Аудио элемент для фоновой музыки (можно заменить src на свой локальный mp3) -->
    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <!-- Скрипт логики, звуков и новеллы -->
    <script>
        // --- WEB AUDIO API (Генерация звуков кликов без внешних файлов) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // --- СЦЕНАРИЙ НОВЕЛЛЫ ---
        const story = [
            { name: "Айрис", text: "Ого, ты обновил движок! Теперь здесь есть звуковые эффекты и анимация парения~ Как тебе?" },
            { name: "Айрис", text: "А еще можно включить фоновую ло-фай музыку сверху справа, чтобы расслабиться во время кодинга.", choices: [
                { text: "Музыка и звуки просто топ!", next: 2 },
                { text: "А как сюда добавить свою аниме-гифку?", next: 3 }
            ]},
            { name: "Айрис", text: "Хе-хе, стараюсь для тебя! Локальные проекты — это лучший способ прокачать навыки веб-разработки.", next: 4 },
            { name: "Айрис", text: "Очень просто! Просто скачай любую анимацию в формате .gif и замени ею эмодзи в коде через тег <img>.", next: 4 },
            { name: "Айрис", text: "Ну что, продолжим создавать крутые штуки вместе?" }
        ];

        let currentStep = 0;
        let isTyping = false;
        let charIndex = 0;
        let timer = null;

        const textElement = document.getElementById('dialogue-text');
        const nameElement = document.getElementById('char-name');
        const dialogueBox = document.getElementById('dialogue-box');
        const choicesContainer = document.getElementById('choices-container');

        function typeWriter(text) {
            textElement.textContent = "";
            charIndex = 0;
            isTyping = true;
            choicesContainer.classList.add('hidden');

            function addChar() {
                if (charIndex < text.length) {
                    textElement.textContent += text.charAt(charIndex);
                    charIndex++;
                    timer = setTimeout(addChar, 25);
                } else {
                    isTyping = false;
                    checkChoices();
                }
            }
            addChar();
        }

        function showStep(stepIndex) {
            if (stepIndex >= story.length) return;
            currentStep = stepIndex;
            const currentLine = story[currentStep];
            
            nameElement.textContent = currentLine.name;
            typeWriter(currentLine.text);
        }

        function checkChoices() {
            const currentLine = story[currentStep];
            if (currentLine.choices) {
                choicesContainer.innerHTML = "";
                currentLine.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "neon-btn w-full py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold text-white text-left shadow-lg flex items-center justify-between";
                    btn.innerHTML = `<span>${choice.text}</span> <span>✨</span>`;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        playClickSound();
                        showStep(choice.next);
                    };
                    choicesContainer.appendChild(btn);
                });
                choicesContainer.classList.remove('hidden');
            }
        }

        // Клик по диалогу
        dialogueBox.addEventListener('click', () => {
            playClickSound();
            if (isTyping) {
                clearTimeout(timer);
                textElement.textContent = story[currentStep].text;
                isTyping = false;
                checkChoices();
            } else {
                if (story[currentStep].choices) return;
                if (currentStep < story.length - 1 && currentStep !== 1) {
                    showStep(currentStep + 1);
                }
            }
        });

        // Управление фоновой музыкой
        const bgm = document.getElementById('bgm');
        const audioToggle = document.getElementById('audio-toggle');
        const audioStatus = document.getElementById('audio-status');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', () => {
            playClickSound();
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                bgm.play().catch(() => {});
                audioStatus.textContent = "ВКЛ";
                audioToggle.classList.add("border-pink-400", "shadow-[0_0_15px_rgba(255,102,196,0.5)]");
            } else {
                bgm.pause();
                audioStatus.textContent = "ВЫКЛ";
                audioToggle.classList.remove("border-pink-400", "shadow-[0_0_15px_rgba(255,102,196,0.5)]");
            }
        });

        // Запуск
        window.onload = () => {
            showStep(0);
        };
    </script>
</body>
</html>
