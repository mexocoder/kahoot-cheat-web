<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Space Atmosphere</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-family: sans-serif;
            color: #fff;
            transition: opacity 0.5s ease;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
        }
        p {
            color: #8892b0;
            margin-bottom: 25px;
            font-size: 14px;
        }
        button {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>DEEP COSMOS</h1>
        <p>Нажмите для запуска полноэкранного режима</p>
        <button onclick="startCosmos()">ИССЛЕДОВАТЬ</button>
    </div>

    <canvas id="spaceCanvas"></canvas>

    <!-- Подключаем Three.js из CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, stars, dust;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        function startCosmos() {
            // 1. Полный экран и горизонтальный режим
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            // Плавное скрытие меню
            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            init3D();
        }

        function init3D() {
            // Сцена
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020205, 0.001);

            // Камера
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 1;

            // Рендерер с сочными настройками цвета
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('spaceCanvas'), antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // --- СОЗДАЕМ ЗВЕЗДНОЕ НЕБО (Несколько слоев разной глубины) ---
            createStarLayers();

            // --- СОЗДАЕМ КОСМИЧЕСКУЮ ПЫЛЬ / ТУМАННОСТЬ ---
            createDustClouds();

            // События управления (сенсор и мышь)
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('pointermove', onPointerMove);

            // Запуск цикла анимации
            animate();
        }

        function createStarLayers() {
            const starsCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starsCount * 3);
            const colors = new Float32Array(starsCount * 3);

            const colorOptions = [
                new THREE.Color('#ffffff'), // Белые
                new THREE.Color('#8ab4f8'), // Холодные голубые
                new THREE.Color('#f28b82'), // Мягкие красные/оранжевые
                new THREE.Color('#fef08a')  // Желтоватые
            ];

            for (let i = 0; i < starsCount * 3; i += 3) {
                // Раскидываем звезды в большой сфере вокруг камеры
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 400 + Math.random() * 600;

                positions[i]     = r * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i + 2] = r * Math.cos(phi);

                const chosenColor = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                colors[i]     = chosenColor.r;
                colors[i + 1] = chosenColor.g;
                colors[i + 2] = chosenColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Простой кастомный материал с мягкими точками (шейдерный подход через спрайты)
            const material = new THREE.PointsMaterial({
                size: 2.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }

        function createDustClouds() {
            // Создаем объемные светящиеся облака пыли для глубины пространства
            const particleCount = 600;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i]     = (Math.random() - 0.5) * 800;
                positions[i + 1] = (Math.random() - 0.5) * 800;
                positions[i + 2] = (Math.random() - 0.5) * 800;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: 25,
                color: new THREE.Color('#1b263b'), // Глубокий сине-фиолетовый туман
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            dust = new THREE.Points(geometry, material);
            scene.add(dust);
        }

        function onPointerMove(event) {
            // Считаем координаты движения пальца/мыши относительно центра экрана
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Плавная инерция камеры за движением пальца (эффект параллакса)
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            camera.rotation.y = targetX * 1.5;
            camera.rotation.x = targetY * 1.5;

            // Медленное вращение звезд и туманностей для живой атмосферы
            if (stars) stars.rotation.y += 0.0002;
            if (dust)  dust.rotation.y  += 0.0004;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
