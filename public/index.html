<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Orbit & Rocket Simulator - MVP</title>
    <style>
        body {
            margin: 0;
            background: #06060f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #00f3ff;
            letter-spacing: 1px;
        }

        .container {
            background: #0f0f1f;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.1);
            border: 1px solid #1f1f3f;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #030308;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .ui-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: #00f3ff;
            border: none;
            padding: 10px 20px;
            color: #06060f;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 243, 255, 0.3);
        }

        button:hover {
            background: #00bcd4;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .telemetry {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a0a0c0;
            display: flex;
            gap: 20px;
        }

        .telemetry span {
            color: #00f3ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Космический Симулятор [MVP]</h1>
        <canvas id="simCanvas" width="700" height="450"></canvas>
        
        <div class="telemetry">
            <div>Высота: <span id="alt">0</span> м</div>
            <div>Скорость: <span id="spd">0</span> м/с</div>
            <div>Топливо: <span id="fuel">100</span>%</div>
        </div>

        <div class="ui-panel">
            <button id="engineBtn" onmousedown="setEngine(true)" onmouseup="setEngine(false)" ontouchstart="setEngine(true)" ontouchend="setEngine(false)">Запустить двигатель</button>
            <button onclick="resetSim()">Сброс</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Параметры мира и объектов
        const planet = { x: 350, y: 500, radius: 180, mass: 5000 };
        let rocket = { 
            x: 350, 
            y: 280, 
            vx: 3.5, 
            vy: 0, 
            fuel: 100,
            angle: -Math.PI / 2
        };

        let engineOn = false;
        let trail = [];

        function setEngine(state) {
            if (rocket.fuel > 0) {
                engineOn = state;
            } else {
                engineOn = false;
            }
        }

        function resetSim() {
            rocket = { x: 350, y: 280, vx: 3.5, vy: 0, fuel: 100, angle: -Math.PI / 2 };
            engineOn = false;
            trail = [];
        }

        function update() {
            // Вектор от ракеты к центру планеты
            let dx = planet.x - rocket.x;
            let dy = planet.y - rocket.y;
            let distSq = dx * dx + dy * dy;
            let dist = Math.sqrt(distSq);

            // Гравитация (Закон всемирного тяготения)
            if (dist > 0) {
                let force = (planet.mass / distSq);
                rocket.vx += (dx / dist) * force * 0.05;
                rocket.vy += (dy / dist) * force * 0.05;
            }

            // Тяга двигателя
            if (engineOn && rocket.fuel > 0) {
                let thrustPower = 0.12;
                rocket.vx += Math.cos(rocket.angle) * thrustPower;
                rocket.vy += Math.sin(rocket.angle) * thrustPower;
                rocket.fuel -= 0.15;
                if (rocket.fuel <= 0) {
                    rocket.fuel = 0;
                    engineOn = false;
                }
            }

            // Движение
            rocket.x += rocket.vx;
            rocket.y += rocket.vy;

            // Направление носа ракеты по вектору движения
            if (Math.abs(rocket.vx) > 0.1 || Math.abs(rocket.vy) > 0.1) {
                rocket.angle = Math.atan2(rocket.vy, rocket.vx);
            }

            // Сохранение следа орбиты
            if (Math.random() < 0.3) {
                trail.push({ x: rocket.x, y: rocket.y });
                if (trail.length > 150) trail.shift();
            }

            // Проверка столкновения с планетой
            if (dist <= planet.radius + 8) {
                rocket.vx = 0;
                rocket.vy = 0;
                engineOn = false;
            }

            // Обновление текста телеметрии
            let currentAlt = Math.max(0, Math.round(dist - planet.radius));
            let currentSpd = Math.round(Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy) * 10);
            document.getElementById('alt').innerText = currentAlt;
            document.getElementById('spd').innerText = currentSpd;
            document.getElementById('fuel').innerText = Math.round(rocket.fuel);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем след орбиты
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < trail.length; i++) {
                if (i === 0) ctx.moveTo(trail[i].x, trail[i].y);
                else ctx.lineTo(trail[i].x, trail[i].y);
            }
            ctx.stroke();

            // Рисуем планету
            let gradient = ctx.createRadialGradient(planet.x, planet.y - 50, 20, planet.x, planet.y, planet.radius);
            gradient.addColorStop(0, '#4a90e2');
            gradient.addColorStop(1, '#10254a');
            
            ctx.beginPath();
            ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();

            // Рисуем ракету
            ctx.save();
            ctx.translate(rocket.x, rocket.y);
            ctx.rotate(rocket.angle + Math.PI / 2);

            // Корпус ракеты
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -12);
            ctx.lineTo(-5, 8);
            ctx.lineTo(5, 8);
            ctx.closePath();
            ctx.fill();

            // Огонь из двигателя
            if (engineOn) {
                ctx.fillStyle = '#ff5500';
                ctx.beginPath();
                ctx.moveTo(-3, 8);
                ctx.lineTo(0, 18 + Math.random() * 6);
                ctx.lineTo(3, 8);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
