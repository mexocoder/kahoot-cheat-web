<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Веб-Проект | Мехо</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Блок автора */
        .author-card {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .author-card h1 {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .author-card p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Интерактивный блок */
        .interactive-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
        }

        .interactive-card h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Список элементов */
        .list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
        }

        /* Калькулятор переключатель */
        .counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .counter-val {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Кто сделал сайт -->
    <div class="author-card">
        <h1>Проект Разработчика</h1>
        <p>Автор: <strong>Мехо</strong></p>
        <div class="skills">
            <span class="tag">HTML5</span>
            <span class="tag">CSS3</span>
            <span class="tag">JavaScript</span>
            <span class="tag">Python</span>
        </div>
    </div>

    <!-- Модуль 1: Список задач/Планов -->
    <div class="interactive-card">
        <h2>📌 Интерактивный список дел</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Введите задачу...">
            <button onclick="addTask()">Добавить</button>
        </div>
        <ul class="list" id="taskList">
            <li class="list-item">
                <span>Изучить основы веб-разработки</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
            </li>
            <li class="list-item">
                <span>Показать проект родителям</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
            </li>
        </ul>
    </div>

    <!-- Модуль 2: Простой счетчик (показывает работу JS) -->
    <div class="interactive-card">
        <h2>⚡ Интерактивный счётчик</h2>
        <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 10px;">
            Нажимай кнопки, чтобы проверить, как код меняет данные в реальном времени:
        </p>
        <div class="counter-box">
            <button onclick="changeCount(-1)">- 1</button>
            <span class="counter-val" id="countVal">0</span>
            <button onclick="changeCount(1)">+ 1</button>
        </div>
    </div>

</div>

<script>
    // Функция добавления новой задачи в список
    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();

        if (text === "") return;

        const ul = document.getElementById('taskList');
        const li = document.createElement('li');
        li.className = 'list-item';
        li.innerHTML = `
            <span>${text}</span>
            <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
        `;

        ul.appendChild(li);
        input.value = "";
    }

    // Функция счетчика
    let count = 0;
    function changeCount(val) {
        count += val;
        document.getElementById('countVal').innerText = count;
    }
</script>

</body>
</html>
