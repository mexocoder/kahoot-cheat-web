<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Симуляция звезды Сириус А</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000 !important;
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Monochromatic Dark Glassmorphism */
        .glass-panel {
            background: rgba(12, 12, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.9),
                        inset 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }

        .glass-button:hover, .glass-button:active {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .glass-button.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Monochromatic Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            height: 6px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        #canvas-container {
            background-color: #000000 !important;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background-color: #000000 !important;
        }
    </style>
</head>
<body class="w-screen h-screen relative bg-black overflow-hidden">

    <!-- Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute inset-0 z-0 bg-black"></div>

    <!-- UI Overlay Header -->
    <header class="absolute top-4 left-4 z-10 pointer-events-none">
        <div class="glass-panel p-3.5 sm:p-4 rounded-xl max-w-xs pointer-events-auto flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center text-white shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                <i data-lucide="sparkle" class="w-6 h-6 animate-pulse"></i>
            </div>
            <div>
                <h1 class="font-orbitron font-extrabold text-base sm:text-lg text-white tracking-widest">SIRIUS 3D</h1>
                <p class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-widest">Симуляция звезды Сириус А</p>
            </div>
        </div>
    </header>

    <!-- Top Right Stats Badge -->
    <div class="absolute top-4 right-4 z-10 pointer-events-none hidden sm:block">
        <div class="glass-panel px-4 py-2.5 rounded-xl text-xs font-mono text-gray-300 flex items-center gap-4 pointer-events-auto border border-white/10">
            <div>СПЕКТР: <span class="text-white font-bold">A1V (Белая звезда)</span></div>
            <div>ТЕМПЕРАТУРА: <span class="text-white font-bold">9,940 K</span></div>
            <div>РАССТОЯНИЕ: <span class="text-white font-bold">8.6 св. лет</span></div>
        </div>
    </div>

    <!-- UI Control Panel -->
    <main class="absolute bottom-4 left-4 right-4 sm:right-4 sm:top-20 sm:left-auto sm:bottom-auto z-10 sm:w-80 pointer-events-auto">
        <div class="glass-panel p-4 rounded-2xl flex flex-col gap-4 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <span class="font-orbitron font-semibold text-xs sm:text-sm text-gray-200 tracking-wider flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-white"></i> ПАНЕЛЬ УПРАВЛЕНИЯ
                </span>
                <button id="btn-toggle-ui" class="text-gray-400 hover:text-white sm:hidden p-1">
                    <i data-lucide="chevron-down" class="w-5 h-5 transition-transform duration-300" id="ui-arrow"></i>
                </button>
            </div>

            <div id="controls-body" class="flex flex-col gap-4">
                <!-- Color Tints -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-gray-400 font-medium">Спектральный режим</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="color-preset glass-button active py-2 rounded-lg text-xs font-semibold text-white flex flex-col items-center gap-1" data-color="sirius">
                            <span class="w-3 h-3 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></span>
                            Сириус А
                        </button>
                        <button class="color-preset glass-button py-2 rounded-lg text-xs font-semibold text-gray-300 flex flex-col items-center gap-1" data-color="ice">
                            <span class="w-3 h-3 rounded-full bg-cyan-200 shadow-[0_0_8px_#a5f3fc]"></span>
                            Ледяной
                        </button>
                        <button class="color-preset glass-button py-2 rounded-lg text-xs font-semibold text-gray-300 flex flex-col items-center gap-1" data-color="mono">
                            <span class="w-3 h-3 rounded-full bg-gray-400 shadow-[0_0_8px_#9ca3af]"></span>
                            Серебро
                        </button>
                    </div>
                </div>

                <!-- Rotation Speed Slider -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400 flex items-center gap-1.5">
                            <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-white"></i> Скорость вращения
                        </span>
                        <span id="val-rotation" class="text-white font-mono">1.0x</span>
                    </div>
                    <input type="range" id="slider-rotation" min="0" max="4" step="0.1" value="1.0" class="w-full">
                </div>

                <!-- Corona Intensity Slider -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400 flex items-center gap-1.5">
                            <i data-lucide="sun" class="w-3.5 h-3.5 text-white"></i> Свечение короны
                        </span>
                        <span id="val-glow" class="text-white font-mono">1.4x</span>
                    </div>
                    <input type="range" id="slider-glow" min="0.2" max="3.0" step="0.1" value="1.4" class="w-full">
                </div>

                <!-- Buttons grid -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button id="btn-toggle-particles" class="glass-button active py-2 px-3 rounded-lg text-xs font-semibold text-gray-200 flex items-center justify-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-white"></i> Частицы
                    </button>
                    <button id="btn-pause" class="glass-button py-2 px-3 rounded-lg text-xs font-semibold text-gray-200 flex items-center justify-center gap-2">
                        <i data-lucide="pause" class="w-4 h-4 text-white" id="icon-pause"></i> Пауза
                    </button>
                </div>

                <!-- Reset Camera -->
                <button id="btn-reset-cam" class="w-full glass-button py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white flex items-center justify-center gap-2 border-dashed">
                    <i data-lucide="compass" class="w-4 h-4 text-white"></i> Сбросить камеру
                </button>
            </div>
        </div>
    </main>

    <!-- Three.js module import -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        lucide.createIcons();

        // 1. SCENE SETUP
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 55);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });
        renderer.setClearColor(0x000000, 1.0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 16;
        controls.maxDistance = 150;

        // 2. PROCEDURAL SIRIUS TEXTURE (Canvas-based)
        function generateSiriusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Monochrome Gradient Base
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.2, '#e5e7eb');
            grad.addColorStop(0.5, '#9ca3af');
            grad.addColorStop(0.8, '#d1d5db');
            grad.addColorStop(1, '#ffffff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // High Density Plasma Noise
            for (let i = 0; i < 40000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 2 + 0.5;
                const opacity = Math.random() * 0.6;
                
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = Math.random() > 0.45 
                    ? `rgba(255, 255, 255, ${opacity})` 
                    : `rgba(20, 24, 33, ${opacity * 0.7})`;
                ctx.fill();
            }

            // Darker Spots / Dynamic contrast
            for (let i = 0; i < 18; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.8) + canvas.height * 0.1;
                const r = Math.random() * 14 + 4;
                
                const spotGrad = ctx.createRadialGradient(x, y, 1, x, y, r);
                spotGrad.addColorStop(0, 'rgba(15, 18, 25, 0.85)');
                spotGrad.addColorStop(0.5, 'rgba(70, 75, 85, 0.3)');
                spotGrad.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = spotGrad;
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const siriusTexture = generateSiriusTexture();

        // 3. STAR MESH (Standard Mesh Material for maximum mobile compatibility)
        const starRadius = 11.5;
        const starGeometry = new THREE.SphereGeometry(starRadius, 64, 64);
        const starMaterial = new THREE.MeshStandardMaterial({
            map: siriusTexture,
            emissiveMap: siriusTexture,
            emissive: new THREE.Color(0xffffff),
            emissiveIntensity: 0.9,
            roughness: 0.4
        });

        const starMesh = new THREE.Mesh(starGeometry, starMaterial);
        scene.add(starMesh);

        // Ambient & Point Lighting
        const starLight = new THREE.PointLight(0xffffff, 2.5, 300);
        scene.add(starLight);

        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        // 4. CORONA GLOW (Glow Mesh using Additive Blending)
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            grad.addColorStop(0.35, 'rgba(209, 232, 255, 0.6)');
            grad.addColorStop(0.7, 'rgba(165, 243, 252, 0.15)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        const glowTexture = createGlowTexture();
        const coronaGeometry = new THREE.SphereGeometry(starRadius * 1.35, 32, 32);
        const coronaMaterial = new THREE.MeshBasicMaterial({
            map: glowTexture,
            color: new THREE.Color(0xd1e8ff),
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            depthWrite: false
        });
        const coronaMesh = new THREE.Mesh(coronaGeometry, coronaMaterial);
        scene.add(coronaMesh);

        // Outer Atmosphere Sprite
        const spriteMaterial = new THREE.SpriteMaterial({
            map: glowTexture,
            color: 0xffffff,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.75
        });
        const coronaSprite = new THREE.Sprite(spriteMaterial);
        coronaSprite.scale.set( starRadius * 3.6, starRadius * 3.6, 1.0 );
        scene.add(coronaSprite);

        // 5. STELLAR PARTICLES
        const particlesCount = 500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = starRadius * 1.3 + Math.random() * 25.0;

            particlePositions[i] = r * Math.sin(phi) * Math.cos(theta);
            particlePositions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            particlePositions[i + 2] = r * Math.cos(phi);
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.8,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.85
        });

        const particlesSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particlesSystem);

        // 6. BACKGROUND STARS
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 1500;
        const starsPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            starsPositions[i] = (Math.random() - 0.5) * 600;
            starsPositions[i + 1] = (Math.random() - 0.5) * 600;
            starsPositions[i + 2] = (Math.random() - 0.5) * 600;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xaaaaaa,
            size: 1.0,
            transparent: true,
            opacity: 0.6
        });
        const starsField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starsField);

        // 7. ANIMATION LOOP
        let isPaused = false;
        let rotationSpeedMultiplier = 1.0;

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                starMesh.rotation.y += 0.003 * rotationSpeedMultiplier;
                coronaMesh.rotation.y -= 0.001 * rotationSpeedMultiplier;
                particlesSystem.rotation.y += 0.0008 * rotationSpeedMultiplier;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 8. EVENT HANDLERS
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mobile UI Panel Toggle
        const btnToggleUi = document.getElementById('btn-toggle-ui');
        const controlsBody = document.getElementById('controls-body');
        const uiArrow = document.getElementById('ui-arrow');
        let uiExpanded = true;

        if (btnToggleUi) {
            btnToggleUi.addEventListener('click', () => {
                uiExpanded = !uiExpanded;
                controlsBody.style.display = uiExpanded ? 'flex' : 'none';
                uiArrow.style.transform = uiExpanded ? 'rotate(0deg)' : 'rotate(-180deg)';
            });
        }

        // Color Presets logic
        const colorPresets = document.querySelectorAll('.color-preset');
        colorPresets.forEach(btn => {
            btn.addEventListener('click', () => {
                colorPresets.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const mode = btn.getAttribute('data-color');
                if (mode === 'sirius') {
                    starMaterial.emissive.setHex(0xffffff);
                    coronaMaterial.color.setHex(0xd1e8ff);
                    coronaSprite.color.setHex(0xffffff);
                } else if (mode === 'ice') {
                    starMaterial.emissive.setHex(0xa5f3fc);
                    coronaMaterial.color.setHex(0x38bdf8);
                    coronaSprite.color.setHex(0x0284c7);
                } else if (mode === 'mono') {
                    starMaterial.emissive.setHex(0x9ca3af);
                    coronaMaterial.color.setHex(0xe5e7eb);
                    coronaSprite.color.setHex(0x6b7280);
                }
            });
        });

        // Sliders
        const sliderRotation = document.getElementById('slider-rotation');
        const valRotation = document.getElementById('val-rotation');
        sliderRotation.addEventListener('input', (e) => {            valRotation.textContent = rotationSpeedMultiplier.toFixed(1) + 'x';
        });

        const sliderGlow = document.getElementById('slider-glow');
        const valGlow = document.getElementById('val-glow');
        sliderGlow.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            coronaMaterial.opacity = 0.8 * (val / 1.4);
            coronaSprite.material.opacity = 0.75 * (val / 1.4);
            valGlow.textContent = val.toFixed(1) + 'x';
        });

        // Toggles & Buttons
        const btnToggleParticles = document.getElementById('btn-toggle-particles');
        let particlesVisible = true;
        btnToggleParticles.addEventListener('click', () => {
            particlesVisible = !particlesVisible;
            particlesSystem.visible = particlesVisible;
            btnToggleParticles.classList.toggle('active', particlesVisible);
        });

        const btnPause = document.getElementById('btn-pause');
        const iconPause = document.getElementById('icon-pause');
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.classList.toggle('active', isPaused);
            iconPause.setAttribute('data-lucide', isPaused ? 'play' : 'pause');
            lucide.createIcons();
        });

        const btnResetCam = document.getElementById('btn-reset-cam');
        btnResetCam.addEventListener('click', () => {
            camera.position.set(0, 10, 55);
            controls.target.set(0, 0, 0);
            controls.update();
        });
    </script>
</body>
</html>
