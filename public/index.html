<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайны Галактики</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #7b71be;
            --card-bg: #8d83d1;
            --accent-card: #5a5099;
            --text-dark: #231c42;
            --text-light: #f3f0ff;
            --shadow-soft: 8px 8px 20px #675ea1, -8px -8px 20px #a398ff;
            --shadow-inset: inset 4px 4px 10px #675ea1, inset -4px -4px 10px #a398ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 25px 15px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .space-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 20%, #8b80d0 0%, #685ca8 100%);
            z-index: -2;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 1;
        }

        /* Поиск */
        .search-bar {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-inset);
        }

        .search-bar input {
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 700;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: #d1cbfa;
        }

        /* Главная карточка */
        .hero-card {
            background: var(--card-bg);
            border-radius: 35px;
            padding: 28px;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .floating-planet {
            position: absolute;
            top: -20px;
            right: 15px;
            font-size: 60px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25));
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }

        .title-group h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 38px;
            text-transform: uppercase;
            color: var(--text-dark);
            line-height: 1;
            margin-bottom: 20px;
        }

        .title-group h1 span {
            color: #382e66;
            display: block;
            font-size: 28px;
        }

        .info-box {
            background: var(--accent-card);
            border-radius: 22px;
            padding: 20px;
            color: var(--text-light);
            box-shadow: var(--shadow-soft);
            margin-bottom: 22px;
            min-height: 120px;
            transition: opacity 0.3s ease;
        }

        .info-box h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffd66b;
        }

        .info-box p {
            font-size: 13.5px;
            line-height: 1.5;
            opacity: 0.95;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-dark);
            box-shadow: var(--shadow-soft);
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn:active {
            box-shadow: var(--shadow-inset);
            transform: scale(0.97);
        }

        /* Навигация */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 22px;
            box-shadow: var(--shadow-inset);
        }

        .nav-item {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: var(--text-dark);
            background: var(--card-bg);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: #fff;
            background: var(--accent-card);
            box-shadow: var(--shadow-inset);
        }

        /* Детали */
        .details-card {
            background: var(--card-bg);
            border-radius: 35px;
            padding: 25px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-bubble {
            background: #988ee0;
            border-radius: 22px;
            padding: 18px;
            box-shadow: var(--shadow-inset);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-dark);
            font-weight: 600;
        }

        .scroll-down {
            align-self: center;
            background: var(--card-bg);
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .scroll-down:active {
            box-shadow: var(--shadow-inset);
        }

        /* Галерея */
        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .grid-item {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            height: 135px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .grid-item:active {
            transform: scale(0.96);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item .arrow-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
        }

        /* Всплывающие модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(35, 28, 66, 0.7);
            backdrop-filter: blur(6px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-width: 360px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .modal-body h2 {
            font-family: 'Fredoka', sans-serif;
            color: var(--text-dark);
            font-size: 22px;
        }

        .modal-body input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 15px;
            border: none;
            background: var(--card-bg);
            box-shadow: var(--shadow-inset);
            color: var(--text-light);
            outline: none;
            font-weight: 700;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 18px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-dark);
        }

        /* Просмотрщик картинок */
        .lightbox-img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
        }
    </style>
</head>
<body>

<div class="space-bg-container"></div>
<canvas id="stars-canvas"></canvas>

<div class="container">

    <!-- Поиск -->
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass" style="color: #e2dcff;"></i>
        <input type="text" id="searchInput" placeholder="Поиск по сайту...">
    </div>

    <!-- Главная секция -->
    <div class="hero-card">
        <div class="floating-planet">🪐</div>

        <div class="title-group">
            <h1 id="tabTitle">О<span>Галактике</span></h1>
        </div>

        <div class="info-box" id="infoBox">
            <h3>ГАЛАКТИКА ЭТО ...</h3>
            <p>Гигантская система из миллиардов звёзд, пыли и тёмной материи. Наш дом — спиральная галактика Млечный Путь!</p>
        </div>

        <div class="btn-group">
            <button class="btn" id="loginBtn">Войти</button>
            <button class="btn" id="createBtn">Создать</button>
        </div>

        <!-- Навигация -->
        <div class="nav-bar">
            <div class="nav-item active" data-tab="home"><i class="fa-solid fa-house"></i></div>
            <div class="nav-item" data-tab="shapes"><i class="fa-solid fa-shapes"></i></div>
            <div class="nav-item" data-tab="settings"><i class="fa-solid fa-gear"></i></div>
            <div class="nav-item" data-tab="user"><i class="fa-solid fa-user"></i></div>
        </div>
    </div>

    <!-- Детали -->
    <div class="details-card">
        <div class="chat-bubble" id="factBox">
            ✨ Знаешь ли ты? В видимой Вселенной насчитывается более 2 триллионов галактик!
        </div>

        <div class="scroll-down" id="scrollBtn">
            ЛИСТАЙ НИЖЕ <i class="fa-solid fa-arrow-down"></i>
        </div>
    </div>

    <!-- Галерея -->
    <div class="grid-gallery" id="gallery">
        <div class="grid-item" data-title="Черная дыра">
            <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=500" alt="Черная дыра">
            <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <div class="grid-item" data-title="Млечный путь">
            <img src="https://images.unsplash.com/photo-1543722530-d2c3201371e7?w=500" alt="Млечный путь">
            <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <div class="grid-item" data-title="Марс">
            <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=500" alt="Марс">
            <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
        </div>
        <div class="grid-item" data-title="Туманность">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=500" alt="Туманность">
            <div class="arrow-btn"><i class="fa-solid fa-plus"></i></div>
        </div>
    </div>

</div>

<!-- Модалка авторизации -->
<div class="modal-overlay" id="authModal">
    <div class="modal-body">
        <span class="modal-close" class="closeModal">&times;</span>
        <h2 id="modalTitle">Вход</h2>
        <input type="text" placeholder="Логин">
        <input type="password" placeholder="Пароль">
        <button class="btn" id="modalSubmit">Подтвердить</button>
    </div>
</div>

<!-- Модалка просмотра фото -->
<div class="modal-overlay" id="imageModal">
    <span class="modal-close" style="color: white; font-size: 35px; top: 20px; right: 25px;">&times;</span>
    <img src="" alt="Просмотр" class="lightbox-img" id="lightboxImg">
</div>

<script>
    // 1. Анимированный звездный фон
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({ length: 70 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
    }));

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
            s.alpha += s.speed;
            if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    animate();

    // 2. Переключение вкладок
    const tabData = {
        home: {
            title: 'О<span>Галактике</span>',
            header: 'ГАЛАКТИКА ЭТО ...',
            text: 'Гигантская система из миллиардов звёзд, пыли и тёмной материи. Наш дом — спиральная галактика Млечный Путь!'
        },
        shapes: {
            title: 'Типы<span>Галактик</span>',
            header: 'ФОРМЫ И ВИДЫ',
            text: 'Галактики бывают Спиральными, Эллиптическими, Линзовидными и Неправильными. Каждая имеет уникальное строение!'
        },
        settings: {
            title: 'Настройки<span>Сайта</span>',
            header: 'ПАРАМЕТРЫ',
            text: 'Здесь можно настроить отображение анимаций, звуковые эффекты космического пространства и тему.'
        },
        user: {
            title: 'Профиль<span>Исследователя</span>',
            header: 'ЛИЧНЫЙ КАБИНЕТ',
            text: 'Войдите в аккаунт, чтобы сохранять понравившиеся снимки космоса и создавать свои коллекции.'
        }
    };

    const navItems = document.querySelectorAll('.nav-item');
    const tabTitle = document.getElementById('tabTitle');
    const infoBox = document.getElementById('infoBox');

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            const tabKey = item.dataset.tab;
            const data = tabData[tabKey];

            infoBox.style.opacity = 0;
            setTimeout(() => {
                tabTitle.innerHTML = data.title;
                infoBox.querySelector('h3').innerText = data.header;
                infoBox.querySelector('p').innerText = data.text;
                infoBox.style.opacity = 1;
            }, 200);
        });
    });

    // 3. Модальные окна (Войти / Создать)
    const authModal = document.getElementById('authModal');
    const modalTitle = document.getElementById('modalTitle');
    const loginBtn = document.getElementById('loginBtn');
    const createBtn = document.getElementById('createBtn');
    const closeModalButtons = document.querySelectorAll('.modal-close');

    loginBtn.addEventListener('click', () => {
        modalTitle.innerText = 'Вход';
        authModal.classList.add('active');
    });

    createBtn.addEventListener('click', () => {
        modalTitle.innerText = 'Регистрация';
        authModal.classList.add('active');
    });

    closeModalButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        });
    });

    document.getElementById('modalSubmit').addEventListener('click', () => {
        alert('Успешно!');
        authModal.classList.remove('active');
    });

    // 4. Просмотр картинок из галереи
    const imageModal = document.getElementById('imageModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const gridItems = document.querySelectorAll('.grid-item');

    gridItems.forEach(item => {
        item.addEventListener('click', () => {
            const imgSrc = item.querySelector('img').src;
            lightboxImg.src = imgSrc;
            imageModal.classList.add('active');
        });
    });

    // 5. Плавная прокрутка
    document.getElementById('scrollBtn').addEventListener('click', () => {
        document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
    });

    // 6. Поиск
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        gridItems.forEach(item => {
            const title = item.dataset.title.toLowerCase();
            if (title.includes(query)) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });
    });
</script>

</body>
</html>
